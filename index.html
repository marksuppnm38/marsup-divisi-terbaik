<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pionir Workspaces</title>
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
<link rel="shortcut icon" href="/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/favicon/site.webmanifest" />
<!-- shell-audit "font loading/layout shifts" fix, and its follow-up "jaggy
     zoom on navigation" fix for pnm-universal.css -- see the various
     `SHARED_LINKS` comments across app/pages/*/index.js for the full story. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="shared-google-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- Unduh script auth PARALEL dengan router.js. Loader di auth-gate.js memuat tiga file ini
     berurutan (supabase-js -> supabase-client -> auth-session) -- tanpa hint ini tiap file baru
     mulai diunduh setelah file sebelumnya selesai. Build produksi menimpa tiga URL ini ke
     file hashed (scripts/build.mjs). -->
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
<link rel="preload" as="script" href="/shared/supabase-client.js">
<link rel="preload" as="script" href="/shared/auth-session.js">
<!-- Logo sidebar (terang + gelap) di-preload supaya muncul sekaligus dengan sidebar, gak telat satu-dua frame. -->
<link rel="preload" as="image" href="/assets/logo-mark-pnm-sidebar.png">
<link rel="preload" as="image" href="/assets/logo-mark-pnm-sidebar-dark.png">
<link id="shared-pnm-universal-css" rel="stylesheet" href="/pnm-universal.css?v=20260813b">
</head>
<body>
<div class="pw-shell">
  <nav id="app-nav" class="pw-nav"></nav>
  <div id="app" class="pw-content"></div>
</div>
<script type="module" src="/app/router.js"></script>
</body>
</html>
