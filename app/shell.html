<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pionir Workspaces</title>
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
<link rel="shortcut icon" href="/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/favicon/site.webmanifest" />
<!-- SPA integration fix (shell audit, "font loading/layout shifts"): every
     module was loading/unloading its own near-identical Google Fonts
     <link> in mount()/unmount() (see e.g. app/pages/dashboard/index.js's
     SHARED_LINKS) -- same Inter/JetBrains Mono family, added and removed
     on every single navigation. Even once cached, swapping the <link> out
     and back in triggers a font recalculation and can cause a visible
     flash/reflow right as a page mounts, which reads as part of the
     module-to-module "hiccup". Loading the union of what every module
     actually needs ONCE here, permanently (never touched by any page's
     mount()/unmount()), means the font is already resolved before any
     per-page link is (redundantly, now harmlessly) added. Not removing
     the per-page links themselves -- touching 6 modules' mount/unmount
     pairs for a load-order optimization is out of scope for this pass. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="shared-google-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- SPA integration fix #2 (same root cause as the Google Fonts fix above,
     found while chasing a reported "jaggy zoom" flicker on every module
     navigation): pnm-universal.css -- the stylesheet behind nearly every
     color/layout token and shared component (.card/.btn/.stat-card/.table-
     section/body background/etc) each module renders with -- was ALSO being
     torn down in every module's unmount() and reloaded from scratch in the
     next module's mount() (see e.g. app/pages/dashboard/index.js's
     SHARED_LINKS + its unmount()'s `getElementById('shared-pnm-universal-
     css')?.remove()`). For the instant between the old page's unmount() and
     the new page's ensureStyle() resolving, NONE of that CSS was applied --
     the incoming markup briefly rendered unstyled (full-width, huge default
     font size, no color) before snapping to its real styled layout the
     moment the link finished loading. That snap is what read as a slight
     "zoom" jump on every navigation. Fix is identical in shape to the fonts
     one: load it once, here, permanently, with the SAME id
     ('shared-pnm-universal-css') every module's loadLink() already checks
     for -- each module's own loadLink() call now just no-ops since the id
     already exists, and the unmount() remove() calls were deleted from all
     six module files (dashboard/stok/crud-produk/konversian/kompres-pdf/
     export-gambar) so nothing ever tears it back down. Version query string
     kept in sync with whatever the six modules' SHARED_LINKS currently
     reference (?v=20260813b as of this fix) -- bump it here AND in all six
     if pnm-universal.css ever needs a cache-bust. -->
<link id="shared-pnm-universal-css" rel="stylesheet" href="/pnm-universal.css?v=20260813b">
</head>
<body>
<!-- Shared auth gate (shared/auth-gate.js) injects itself as a fixed-position
     overlay directly into <body> the first time router.js calls initAuthGate()
     -- lives here, OUTSIDE .pw-shell, so it can cover the whole screen before
     nav/content below it are even populated. See map-history.md sesi
     kesembilan belas for why this replaced 5 separate per-module gates. -->
<div class="pw-shell">
  <nav id="app-nav" class="pw-nav" style="display:none;"></nav>
  <div id="app" class="pw-content"></div>
</div>
<script type="module" src="/app/router.js"></script>
</body>
</html>
